services:
  # L1 Network - Hardhat
  hardhat-n1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guarani-hardhat-n1
    command: npm run node:n1
    ports:
      - "8545:8545"
    networks:
      - guarani-network
    environment:
      - NODE_ENV=production
    volumes:
      - ./contracts:/app/contracts
      - ./scripts:/app/scripts
      - hardhat-cache:/app/cache
      - hardhat-artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # L2 Network - Anvil
  anvil-n2:
    build:
      context: .
      dockerfile: Dockerfile.anvil
    container_name: guarani-anvil-n2
    ports:
      - "9545:9545"
    networks:
      - guarani-network
    environment:
      - RUST_LOG=info
    volumes:
      - ./contracts:/app/contracts
      - ./scripts:/app/scripts
    depends_on:
      hardhat-n1:
        condition: service_healthy

  # Relayer Service (elige ZK o clásico según ENABLE_ZK_PROOF_WAY)
  relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guarani-relayer
    # El entrypoint decide relayer-zk.js vs relayer.js según el flag.
    command: ["bash", "relayer/docker-entrypoint.sh"]
    # En modo ZK, bb.js genera la prueba en el contenedor (SRS + RAM). Dale memoria.
    mem_limit: 6g
    networks:
      - guarani-network
    environment:
      - NODE_ENV=production
      - RPC_URL_N1=http://hardhat-n1:8545
      - RPC_URL_N2=http://anvil-n2:9545
      - NODE_OPTIONS=--max-old-space-size=4096
      - ENABLE_ZK_PROOF_WAY=${ENABLE_ZK_PROOF_WAY:-false}
      - PRIVATE_KEY_RELAYER=${PRIVATE_KEY_RELAYER}
    # Monta el proyecto para ver deploy-*.json, circuits/ (ACIR) y el fixture.
    # node_modules queda el de la imagen (incluye bb.js / noir_js).
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - hardhat-n1
      - anvil-n2

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: guarani-frontend
    ports:
      - "3000:3000"
    networks:
      - guarani-network
    volumes:
      - ./public:/app/public
    depends_on:
      - hardhat-n1

  # Deployment Helper - runs deployment scripts
  deployer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guarani-deployer
    command: /bin/bash
    stdin_open: true
    tty: true
    networks:
      - guarani-network
    environment:
      - NODE_ENV=production
      - ENABLE_ZK_PROOF_WAY=${ENABLE_ZK_PROOF_WAY:-false}
      - PRIVATE_KEY_RELAYER=${PRIVATE_KEY_RELAYER}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - hardhat-n1
      - anvil-n2
    profiles:
      - deployer

networks:
  guarani-network:
    driver: bridge

volumes:
  hardhat-cache:
  hardhat-artifacts:
